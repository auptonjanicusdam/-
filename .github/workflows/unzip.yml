name: Auto Unzip Project
on:
  push:
  workflow_dispatch:
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip the project
        run: |
          unzip -o SavedKeyboard-full.zip -d .
          rm SavedKeyboard-full.zip
          
      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add . -f
          git commit -m "Auto-unzip project files" || echo "No changes to commit"
          git push
